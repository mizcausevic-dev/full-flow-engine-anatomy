name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install, verify, build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run verify
          npm run build

      - name: Publish the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work=$(mktemp -d)
          cp -a dist/. "$work/"
          touch "$work/.nojekyll"
          cd "$work"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish sectional explainer"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Set repository topics and description
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/topics" \
            -f 'names[]=aerospace' \
            -f 'names[]=rocket-propulsion' \
            -f 'names[]=staged-combustion' \
            -f 'names[]=full-flow' \
            -f 'names[]=raptor' \
            -f 'names[]=technical-visualization' \
            -f 'names[]=methalox' \
            -f 'names[]=engineering-education' \
            -f 'names[]=regenerative-cooling' \
            -f 'names[]=de-laval' || echo "Topic update skipped."
          gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}" \
            -f description='Frame-accurate sectional anatomy of a Raptor-inspired full-flow staged combustion cycle, with no invented pressures or shaft speeds.' \
            -f homepage='https://mizcausevic-dev.github.io/full-flow-engine-anatomy/' || echo "Description update skipped."
